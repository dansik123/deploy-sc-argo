apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ .Values.appName }}-cert"
  namespace: "{{ .Values.appName }}-ns"
spec:
  secretName: "{{ .Values.appName }}-ssl"
  dnsNames:
  - "{{ .Values.frontend.url }}"
  issuerRef:
    name: ca-cluster-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: "{{ .Values.appName }}-gateway"
  namespace: "{{ .Values.appName }}-ns"
spec:
  gatewayClassName: envoy-gateway # Ensure this matches your Envoy Gateway installation
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: "{{ .Values.appName }}-ssl"
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: "{{ .Values.appName }}-frontend-route"
  namespace: "{{ .Values.appName }}-ns"
spec:
  parentRefs:
  - name: "{{ .Values.appName }}-gateway" # Reference the Gateway defined above
  rules:
  - matches:
    - path:
        type: Prefix
        value: "/" # Matches all paths
    backendRefs:
    - name: "{{ .Values.appName }}-frontend-service"
      port: 80
  hostnames:
  - "{{ .Values.frontend.url }}"
